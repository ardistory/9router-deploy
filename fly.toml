app = "9router-deploy"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "20128"
  HOSTNAME = "0.0.0.0"

[mounts]
  source = "9router_data"
  destination = "/app/data"

[http_service]
  auto_start_machines = true
  auto_stop_machines = "stop"
  force_https = true
  internal_port = 20128
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
